#
# When a release is published (from the GitHub UI or `gh release create`),
# publish the image: the 'main' image, already built and tested when its pull
# request merged, is re-tagged with the release's tag and pushed to the GitHub
# Container Registry, and to Docker Hub as bp3global/c8sh:TAG and :latest.
# Nothing is rebuilt.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  GITHUB_IMAGE: ghcr.io/bp3/c8sh
  DOCKER_IMAGE: bp3global/c8sh

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the main image
        run: docker pull "$GITHUB_IMAGE:main"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: bp3docker
          password: ${{ secrets.DOCKERHUB_BP3DOCKER }}

      - name: Tag and push to the GitHub Container Registry
        run: |
          docker tag "$GITHUB_IMAGE:main" "$GITHUB_IMAGE:$GITHUB_REF_NAME"
          docker push "$GITHUB_IMAGE:$GITHUB_REF_NAME"

      - name: Tag and push to Docker Hub
        run: |
          docker tag "$GITHUB_IMAGE:main" "$DOCKER_IMAGE:$GITHUB_REF_NAME"
          docker tag "$GITHUB_IMAGE:main" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:$GITHUB_REF_NAME"
          docker push "$DOCKER_IMAGE:latest"
